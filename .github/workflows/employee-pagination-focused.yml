name: Employee pagination focused proof

on:
  pull_request:
    branches: [main, develop, staging]

permissions:
  contents: read

concurrency:
  group: employee-pagination-focused-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  focused-pagination:
    name: focused-pagination-49
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      MalievWorkspaceRoot: ${{ github.workspace }}/.dependencies
      GITHUB_ACTIONS: 'false'
      MSBUILDDISABLENODEREUSE: '1'
      DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: '1'
    steps:
      - name: Check out exact EmployeeService head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out frozen Defaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: c40a7f82cea347b949444dcd7fb730f2b8dc3c0e
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out frozen Contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Validate focused raw parser controls
        run: python3 -B scripts/test_employee_pagination_focused_validator.py
      - name: Restore focused solution
        timeout-minutes: 4
        run: |
          mkdir -p runner-focused
          export GITHUB_ACTIONS=false
          python3 -B scripts/verify_employee_pagination_focused.py guard | tee runner-focused/restore-admission.jsonl
          timeout --signal=TERM --kill-after=15s 180s dotnet restore Legacy.Maliev.EmployeeService.slnx -nodeReuse:false
      - name: Build focused Release with zero warnings and errors
        timeout-minutes: 6
        run: |
          export GITHUB_ACTIONS=false
          python3 -B scripts/verify_employee_pagination_focused.py guard | tee runner-focused/build-admission.jsonl
          timeout --signal=TERM --kill-after=15s 300s dotnet build Legacy.Maliev.EmployeeService.slnx -c Release --no-restore --warnaserror -nodeReuse:false -p:UseSharedCompilation=false | tee runner-focused/build.log
      - name: Run separate 49 focused cases
        timeout-minutes: 11
        run: |
          export GITHUB_ACTIONS=false
          python3 -B scripts/verify_employee_pagination_focused.py guard | tee runner-focused/test-admission.jsonl
          timeout --signal=TERM --kill-after=15s 600s dotnet test Legacy.Maliev.EmployeeService.Tests/Legacy.Maliev.EmployeeService.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName~EmployeeDirectoryParityHttpTests|FullyQualifiedName~Application.EmployeeApplicationServiceTests|FullyQualifiedName~EmployeeDefaultPageHttpTests|FullyQualifiedName~EmployeeDocumentationAcceptanceTests.Documentation_ExplainsExistingDirectoryDefaultsAndQueryNames" --logger trx --results-directory runner-focused
      - name: Gate exact original focused identities and raw joins
        run: python3 -B scripts/verify_employee_pagination_focused.py verify
      - name: Preserve original focused evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: employee-focused-${{ github.sha }}
          path: runner-focused
          if-no-files-found: warn
          retention-days: 7
